[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/client",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["net", "time", "sync", "rt-multi-thread", "macros", "io-util", "io-std"] }
aes = "0.8"
eax = "0.5"
cipher = "0.4"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
curve25519-dalek = { version = "4", features = ["legacy_compatibility", "digest"] }
ed25519-dalek = { version = "2", features = ["hazmat"] }
sha1 = "0.10"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
base64 = "0.22"
bytes = "1"
bitflags = "2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hex = "0.4"
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
resvg = "0.44"
zip = { version = "2", default-features = false, features = ["deflate"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
cpal = "0.15"
open = "5"
